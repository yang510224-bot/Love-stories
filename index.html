</style></head><body><main class="wrap"><section id="home"><div class="brand">STORIES OF ORDINARY LOVE</div><h1 class="lead">欸，你幹嘛啦！</h1><div class="sub">有些愛，一直都在。<br>不是每個人都善於說出口，也不是每個離開，都會把過去抹掉。</div><div class="tiles" id="tiles"></div><p class="footer">互動短篇 · 依選擇改變對話 · 適合 iPhone</p></section><section class="story" id="story"><div class="nav"><button class="back" id="homebtn">← 故事館</button><span class="counter" id="count"></span></div><progress id="bar" max="100" value="0"></progress><div class="sceneArt" id="art"></div><div class="time" id="time"></div><h2 class="chapter" id="title"></h2><div class="prose" id="text"></div><div class="choices" id="choices"></div><div id="extra"></div><div class="note" id="footnote"></div></section></main>
<script>
const stories=[
{id:'pot',name:'夜雨之後',tag:'一頓沒吃成的火鍋',emoji:'🍲',more:'星期三煎壞的蛋，星期五沒吃成的火鍋。',steps:[
{time:'星期三 · 20:46',title:'半熟蛋，完全熟',body:'「你吃飯了？」\n「吃了啊。」\n你打開冰箱，只剩兩顆蛋。\n他看你一眼，把遊戲暫停。\n「……我煎給你啦。」\n\n「我要半熟的。」\n「我知道啦！」\n三分鐘後，蛋黃全熟。\n他低聲罵了一句，還是把比較漂亮的那一顆給你。',opts:[['「其實我想跟你一起吃。」','soft'],['「你的半熟是石頭嗎？」','joke'],['從後面抱他一下','hug']]},
{time:'星期三 · 21:16',title:'三片肉',body:'隔壁阿姨敲門，提醒陽台衣服淋濕了。\n他衝去救制服，一隻襪子卻掉到樓下。\n「靠，那隻很好穿欸！」\n你笑得直不起腰。\n\n後來他窩在沙發上，忽然說：「禮拜五去吃火鍋？」\n「你主動約喔？」\n「不然勒。可是這次不准偷吃我三片肉。」',opts:[['「你還記得三片喔？」','joke'],['「我很開心你主動約我。」','soft'],['「星期五七點半，我訂位。」','plan']]},
{time:'星期五 · 18:47',title:'穿好了的衣服',body:'你已經換好衣服。\n手機亮了。\n\n「我臨時有事，火鍋今天沒辦法了。抱歉。」\n\n你看向桌上昨天選好的菜單。\n訊息上顯示已讀。\n你不知道他正在做什麼。',opts:[['「你不是自己約我的嗎？」','anger'],['「發生什麼事了？」','ask'],['「我已經換好衣服了欸。」','hurt']]},
{time:'星期五 · 20:46',title:'門口的另一雙鞋',body:'回到家，玄關多了一雙白鞋。\n廚房傳來他的笑聲。桌上有兩個便當盒，以及你愛吃的布丁。\n\n他看到你，先是一愣。\n「欸，我朋友來一下。」\n「……你不要先生氣喔。」\n\n朋友走出來，眼睛紅紅的。\n「抱歉，我剛分手。是他叫我過來的。」\n\n他終於看著你。\n「我不該只說有事。但我當時真的不能丟下他。」',opts:[['「你可以陪他，但不要讓我一直等。」','honest'],['「所以我的感受就不重要？」','anger'],['「他現在還好嗎？」','care']]},
{time:'星期五 · 21:38',title:'一盒布丁',body:'朋友走了。\n他把布丁推到你面前。\n\n「我今天也有想跟你吃火鍋啊。」\n手機又響，是剛剛的朋友。\n他看著螢幕，沒有立刻接。\n你忽然不知道該希望他留下，還是希望他接電話。',opts:[['「你先確認他好不好，然後陪我一下。」','care'],['「其實我現在也需要你。」','honest'],['「今天先這樣吧。」','distance']]}],
reveal:'18:04，他收到朋友的求救訊息。\n他看了看你們訂好的火鍋，猶豫很久。\n\n他不擅長解釋，也怕你失望，最後只傳「有事」。\n\n在便利商店，他突然說：「幫我拿那個布丁。」\n朋友問：「誰要吃？」\n他說：「我家那個。」\n\n這些都沒有讓那次失約變得不痛。但那盒布丁也不是無緣無故出現的。'},
{id:'light',name:'留一盞燈',tag:'六年的樓梯燈',emoji:'💡',more:'一盆九重葛、一把螺絲起子，以及六年來誰都沒有講破的事。',steps:[
{time:'星期日 · 19:38',title:'那盆不見了的植物',body:'你和阿岳住同一棟公寓六年。他住五樓，你住四樓。\n\n上次你半夜發燒，他送藥過來，隔天照樣跟你算七十六塊。\n\n但他最近常常不回訊息。\n而今天，你們一起照顧三年的九重葛不見了。\n\n他回你：「搬走了。樓梯不能放東西。」',opts:[['「你最近是不是在躲我？」','ask'],['「那盆養三年欸！你搬去哪？」','plant'],['直接上五樓敲門','door']]},
{time:'星期日 · 19:51',title:'他沒說的事',body:'阿岳開門時，穿著舊 T 恤，肩膀都是灰。\n後面堆滿紙箱。\n\n「你要搬家？」\n「對啊，公司調台中。」\n「什麼時候？」\n「明天。」\n\n你愣住了。\n他抱起紙箱，底下突然破了，螺絲灑滿樓梯。\n「幹！！！」',opts:[['蹲下去幫他撿螺絲','help'],['「你他媽螺絲真的掉滿地了。」','joke'],['「你怎麼現在才跟我講？」','hurt']]},
{time:'星期日 · 20:18',title:'三年前的那顆',body:'你們蹲著撿螺絲。\n他忽然指著其中一顆。\n\n「欸，那顆是三年前你借我的吧。」\n「哪有人記螺絲記三年？」\n「我啊，我還沒還。」\n\n你們笑了一下。\n然後他低頭說：「其實我沒有很想走啦。」\n\n你問他為什麼不早說。\n「因為我一想到你會問九重葛怎麼辦，就不知道怎麼回答。」',opts:[['「我以為你討厭我了。」','honest'],['「今晚我陪你整理。」','help'],['「我還是很生氣。」','hurt']]},
{time:'星期日 · 22:07',title:'一把鑰匙',body:'搬完最後一箱，他把借來的螺絲起子還給你。\n還有你家的備用鑰匙。\n\n「以後沒辦法幫你收包裹了。」\n\n他走到門口，又說：「欸，你家玄關燈記得修。」\n「幹嘛？」\n「每次你加班回來都黑的啊。」\n\n「你怎麼知道？」\n\n他撇頭。\n「以前晚上聽到你回家，我會幫你把樓梯燈打開。」\n\n停了一秒。\n「不然你摸黑開門真的很吵。」',opts:[['「……你怎麼都不講？」','honest'],['伸手抱他一下','hug'],['「以後換我自己開啦。」','soft']]},
{time:'星期一 · 23:16',title:'燈還亮著',body:'阿岳搬去台中了。\n九重葛回到四樓。\n\n今天你又加班。\n回到家，樓梯間是暗的。\n你伸手按下開關。\n\n燈亮了。\n\n這時手機震動。\n「欸，九重葛有澆水嗎？不要又澆到爛掉欸。」\n\n你看著亮起的樓梯，忽然想到過去那六年。',opts:[['「有啦，你很煩欸。」','joke'],['「欸，謝謝你。」','soft'],['拍一張亮著的樓梯燈傳給他','light']]}],
reveal:'一個月前，公司通知阿岳調去台中。\n他坐在陽台，看著九重葛。\n\n朋友問：「怎麼不跟樓下那個講？」\n「就因為很熟，才不知道怎麼講啊。」\n\n回家經過四樓，看見你門口的包裹。\n他幫你放好，順手把樓梯燈打開。\n\n「靠，以後誰幫這個白癡開燈。」'},
{id:'cat',name:'他的貓，我的夏天',tag:'一隻貓，兩個人的夏天',emoji:'🐈',more:'阿凱說要去日本半年，留下了一隻怕生的貓，還有一些沒說完的話。',steps:[
{time:'六月 · 下午 16:20',title:'丸子要借住',body:'「我下個月要去日本做研究，半年。」\n\n阿凱站在你家門口，手裡抱著貓籠。\n丸子縮在角落，只露出兩隻眼睛。\n\n「你可以幫我照顧牠嗎？」\n\n你瞪他。\n「欸，那你自己咧？」\n他笑了一下。\n「我又不是不回來。」',opts:[['「你確定了喔？」','ask'],['「丸子又不是行李。」','hurt'],['「好啊，但貓砂你買。」','joke']]},
{time:'六月 · 晚上 20:04',title:'怕生的房客',body:'丸子在床底下待了三個小時。\n你放下貓條，假裝沒看牠。\n\n阿凱傳來訊息：「牠怕吹風機，喜歡窗邊的位置。」\n接著又傳：「牠吃飯要先聞三次。」\n\n「你當我沒養過貓是不是？」\n他回：「你沒養過啊。」\n\n過一分鐘，他又傳：「謝謝你啦。」',opts:[['拍下丸子露出半張臉的照片','photo'],['「牠比你還難搞。」','joke'],['「你最近是不是有點不太一樣？」','ask']]},
{time:'七月 · 晚上 22:11',title:'最近還好嗎',body:'你和丸子相處的日子，慢慢變成習慣。\n每天鏟砂、擦地、被牠叫醒。\n\n阿凱的訊息卻越來越少。\n你有時候想問他最近好不好，又怕打擾。\n\n今晚他傳來一張窗外的夜景。\n「這裡很漂亮。」\n\n你看著丸子睡在你的枕頭邊。',opts:[['「丸子今天又睡我枕頭了。」','photo'],['「那你最近過得好嗎？」','care'],['「喔，風景比我好看喔。」','joke']]},
{time:'十二月 · 傍晚 18:24',title:'他回來了',body:'出發前一週，阿凱回台灣了。\n你們帶丸子到河堤散步。\n\n他看著遠方說：「我其實一直很擔心，丟下你們會不會很自私。」\n\n你愣了一下。\n「你們？」\n\n他蹲下來摸摸丸子的背。\n「沒有啦，講錯了。」\n\n晚風吹過來。\n你發現自己也有很多事情沒跟他說。',opts:[['「你不自私。」','soft'],['「我會想你欸。」','honest'],['「你欠我半年鏟貓砂費。」','joke']]},
{time:'十二月 · 下午 15:10',title:'一封寫給你的信',body:'阿凱準備帶丸子回去了。\n丸子在籠子裡對著你喵了一聲。\n\n阿凱拿給你一個信封。\n\n「那個……等我走了再看。」\n\n門關上後，你慢慢拆開。\n\n「謝謝你願意照顧丸子。牠謝謝你總是這麼溫柔。我可能不太會說這種話，但有你這樣的朋友，真的很幸運。\n\n我們都會很好。」\n\n窗邊還留著一小團貓毛。',opts:[['「你也要好好的。」','soft'],['「我會想牠，也會想你。」','honest'],['拍下窗邊那團貓毛','photo']]}],
reveal:'去日本的第一晚，阿凱盯著手機裡丸子的照片很久。\n\n他不只擔心丸子換環境。\n他也擔心自己是不是把一件很重要的事，交給了一個太願意照顧別人的人。\n\n他其實寫過好多次訊息想問：「你會不會覺得我很自私？」\n最後每次都刪掉，只問：「丸子有吃飯嗎？」'}
];
let active=null,idx=0,log=[],revealed=false;const $=id=>document.getElementById(id);
function esc(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){active=null;$('home').style.display='block';$('story').style.display='none';history.replaceState({},'',location.pathname)}
function start(id){active=stories.find(x=>x.id===id);idx=0;log=[];revealed=false;$('home').style.display='none';$('story').style.display='block';history.replaceState({},'','#'+id);render()}
function pick(label,tag){log.push({label,tag});idx++;render()}
function render(){if(!active)return;let end=idx>=active.steps.length;
$('count').textContent=end?'終章':(idx+1)+' / '+active.steps.length;$('bar').value=end?100:idx/active.steps.length*100;
$('art').className='sceneArt '+active.id;$('art').textContent=active.emoji;
$('extra').innerHTML='';$('choices').innerHTML='';
if(!end){let s=active.steps[idx];$('time').textContent=s.time;$('title').textContent=s.title;
let tail='';if(idx>0&&log.length){const previous=log[log.length-1].tag;if(previous==='anger'||previous==='hurt')tail='\n\n他知道你不高興，但沒有立刻說出一個讓你滿意的答案。';else if(previous==='joke')tail='\n\n你們至少笑了一下。有些難說的話，還沒真的說出口。';else if(previous==='hug')tail='\n\n他愣了一下，沒有把你推開。';else if(previous==='care'||previous==='help')tail='\n\n他看見你的動作，沒有馬上說謝謝。'}$('text').textContent=s.body+tail;
s.opts.forEach(a=>{const b=document.createElement('button');b.className='choice';b.textContent=a[0]+'  ›';b.onclick=()=>pick(a[0],a[1]);$('choices').append(b)});
$('footnote').textContent='沒有所謂正確選項。故事裡的人也有自己的需要。'}else{$('time').textContent='最後 · 你可以選擇知道更多';$('title').textContent='有些話，當時沒有說出口。';$('text').textContent='故事走到這裡。你不一定得到想要的答案，但那些曾經發生的小事，都不是假的。';
const box=$('extra');const see=document.createElement('button');see.className='secondary';see.textContent=revealed?'隱藏另一個視角':'看一眼他的視角';see.onclick=()=>{revealed=!revealed;render()};box.append(see);if(revealed){const e=document.createElement('div');e.className='reveal';e.textContent=active.reveal;box.append(e)}
const cap=document.createElement('p');cap.className='note';cap.textContent='如果要留下一句話，你會說什麼？';box.append(cap);const ta=document.createElement('textarea');ta.placeholder='不用像結論。你真正想說的就好。';ta.id='last';box.append(ta);
const save=document.createElement('button');save.className='primary';save.textContent='留下這句話';save.onclick=()=>{if(!ta.value.trim())return;const value=ta.value.trim();let old=$('saved');if(old)old.remove();const p=document.createElement('div');p.id='saved';p.className='quote';p.textContent='「'+value+'」\n\n我收到了。這句話不用變成什麼標準答案。';box.append(p)};box.append(save);
const copy=document.createElement('button');copy.className='secondary';copy.textContent='複製我的遊玩紀錄';copy.onclick=()=>{let t=active.name+'\n'+log.map((x,i)=>(i+1)+'. '+x.label).join('\n')+'\n最後：'+ta.value;navigator.clipboard?.writeText(t).then(()=>{copy.textContent='已複製'},()=>{copy.textContent='無法複製，請手動選取文字'})};box.append(copy);const again=document.createElement('button');again.className='secondary';again.textContent='返回故事館';again.onclick=home;box.append(again);$('footnote').textContent='這是互動短篇試玩版；另一個視角不是替任何人開脫。'}}
}
$('tiles').innerHTML=stories.map(s=>'<button class="tile" data-id="'+s.id+'"><div class="art '+s.id+'">'+s.emoji+'</div><div class="detail"><span class="arrow">↗</span><strong>'+s.name+'</strong><small>'+s.more+'</small></div></button>').join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>start(b.dataset.id));$('homebtn').onclick=home;const hash=location.hash.slice(1);if(stories.some(s=>s.id===hash))start(hash);
</script></body></html>
