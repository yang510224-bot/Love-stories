const stories=[
{id:'pot',name:'夜雨之後',tag:'一頓沒吃成的火鍋',emoji:'🍲',more:'星期三煎壞的蛋，星期五沒吃成的火鍋。',steps:[{"time":"星期三 · 17:36","title":"星期五，先說好喔","body":"超市門口下著雨，他突然指著火鍋海報。\n「欸，星期五要不要去吃？」\n\n你以為他在開玩笑。\n但他拿出手機，真的把星期五晚上七點半放進行事曆。\n\n「你要鴛鴦鍋還是麻辣？」\n\n他把雨傘往你的方向移。你突然開始期待那個還沒到的晚上。","opts":[["「吃完一起散步？」","walk","他說：「不要走太遠啦。」但沒有拒絕。"],["「這次我可以偷幾片肉？」","meat","「一片。最多一片！」你們笑著走進雨裡。"],["「你主動約的喔，別忘記。」","promise","他把行事曆畫面拿到你面前：「有記啦！」"]]},
{time:'星期三 · 20:46',title:'半熟蛋，完全熟',body:'「你吃飯了？」\n「吃了啊。」\n你打開冰箱，只剩兩顆蛋。\n他看你一眼，把遊戲暫停。\n「……我煎給你啦。」\n\n「我要半熟的。」\n「我知道啦！」\n三分鐘後，蛋黃全熟。\n他低聲罵了一句，還是把比較漂亮的那一顆給你。',opts:[['「其實我想跟你一起吃。」','soft'],['「你的半熟是石頭嗎？」','joke'],['從後面抱他一下','hug']]},
{time:'星期三 · 21:16',title:'三片肉',body:'隔壁阿姨敲門，提醒陽台衣服淋濕了。\n他衝去救制服，一隻襪子卻掉到樓下。\n「靠，那隻很好穿欸！」\n你笑得直不起腰。\n\n後來他窩在沙發上，拿起手機確認行事曆。\n「欸，星期五火鍋七點半喔？我有記。」\n「你下午不是才約過？」\n「確認一下不行喔？」\n他瞥你一眼，忽然補一句：「可是這次不准偷吃我三片肉。」',opts:[['「你還記得三片喔？」','joke'],['「其實你今天主動約我，我很開心。」','soft'],['「好，七點半我來訂位。」','plan']]},
{time:'星期五 · 18:47',title:'穿好了的衣服',body:'你已經換好衣服。\n手機亮了。\n\n「我臨時有事，火鍋今天沒辦法了。抱歉。」\n\n你看向桌上昨天選好的菜單。\n訊息上顯示已讀。\n你不知道他正在做什麼。',opts:[['「你不是自己約我的嗎？」','anger'],['「發生什麼事了？」','ask'],['「我已經換好衣服了欸。」','hurt']]},
{time:'星期五 · 20:46',title:'門口的另一雙鞋',body:'回到家，玄關多了一雙白鞋。\n廚房傳來他的笑聲。桌上有兩個便當盒，以及你愛吃的布丁。\n\n他看到你，先是一愣。\n「欸，我朋友來一下。」\n「……你不要先生氣喔。」\n\n朋友走出來，眼睛紅紅的。\n「抱歉，我剛分手。是他叫我過來的。」\n\n他終於看著你。\n「我不該只說有事。但我當時真的不能丟下他。」',opts:[['「你可以陪他，但不要讓我一直等。」','honest'],['「所以我的感受就不重要？」','anger'],['「他現在還好嗎？」','care']]},
{time:'星期五 · 21:38',title:'一盒布丁',body:'朋友走了。\n他把布丁推到你面前。\n\n「我今天也有想跟你吃火鍋啊。」\n手機又響，是剛剛的朋友。\n他看著螢幕，沒有立刻接。\n你忽然不知道該希望他留下，還是希望他接電話。',opts:[['「你先確認他好不好，然後陪我一下。」','care'],['「其實我現在也需要你。」','honest'],['「今天先這樣吧。」','distance']]}],
reveal:'18:04，他收到朋友的求救訊息。\n他看了看你們訂好的火鍋，猶豫很久。\n\n他不擅長解釋，也怕你失望，最後只傳「有事」。\n\n在便利商店，他突然說：「幫我拿那個布丁。」\n朋友問：「誰要吃？」\n他說：「我家那個。」\n\n這些都沒有讓那次失約變得不痛。但那盒布丁也不是無緣無故出現的。'},
{id:'light',name:'留一盞燈',tag:'六年的樓梯燈',emoji:'💡',more:'一盆九重葛、一把螺絲起子，以及六年來誰都沒有講破的事。',steps:[{"time":"三年前 · 颱風過後","title":"你們一起搬起那盆花","body":"九重葛被颱風吹倒在樓梯間。\n你一個人搬不起來，阿岳穿著拖鞋下樓幫你。\n\n「你是在跟一盆植物打架喔？」\n\n你說以後等花開了，樓梯間一定很好看。\n他一邊幫你扶花盆一邊笑：「先活到下星期再說啦。」\n\n你們第一次約好一起照顧它。","opts":[["「我澆水，你幫我顧花盆。」","plant","他嫌你會把花淹死，隔天還是找來接水的盆子。"],["「等開花我們拍照！」","photo","他說很無聊，卻真的拿起手機拍了一張滿是泥土的花盆。"],["「以後路過也幫我看看嘛。」","look","他說：「我沒那麼閒。」但走上樓時還是回頭看了一眼。"]]},
{time:'星期日 · 19:38',title:'那盆不見了的植物',body:'你和阿岳住同一棟公寓六年。他住五樓，你住四樓。\n\n上次你半夜發燒，他送藥過來，隔天照樣跟你算七十六塊。\n\n但他最近常常不回訊息。\n而今天，你們一起照顧三年的九重葛不見了。\n\n他回你：「搬走了。樓梯不能放東西。」',opts:[['「你最近是不是在躲我？」','ask'],['「那盆養三年欸！你搬去哪？」','plant'],['直接上五樓敲門','door']]},
{time:'星期日 · 19:51',title:'他沒說的事',body:'阿岳開門時，穿著舊 T 恤，肩膀都是灰。\n後面堆滿紙箱。\n\n「你要搬家？」\n「對啊，公司調台中。」\n「什麼時候？」\n「明天。」\n\n你愣住了。\n他抱起紙箱，底下突然破了，螺絲灑滿樓梯。\n「幹！！！」',opts:[['蹲下去幫他撿螺絲','help'],['「你他媽螺絲真的掉滿地了。」','joke'],['「你怎麼現在才跟我講？」','hurt']]},
{time:'星期日 · 20:18',title:'三年前的那顆',body:'你們蹲著撿螺絲。\n他忽然指著其中一顆。\n\n「欸，那顆是三年前你借我的吧。」\n「哪有人記螺絲記三年？」\n「我啊，我還沒還。」\n\n你們笑了一下。\n然後他低頭說：「其實我沒有很想走啦。」\n\n你問他為什麼不早說。\n「因為我一想到你會問九重葛怎麼辦，就不知道怎麼回答。」',opts:[['「我以為你討厭我了。」','honest'],['「今晚我陪你整理。」','help'],['「我還是很生氣。」','hurt']]},
{time:'星期日 · 22:07',title:'一把鑰匙',body:'搬完最後一箱，他把借來的螺絲起子還給你。\n還有你家的備用鑰匙。\n\n「以後沒辦法幫你收包裹了。」\n\n他走到門口，突然停下。\n「欸，你樓梯口那個門牌歪很久了吧？」\n「蛤？你現在還在管這個？」\n「看了六年，很阿雜啊。」\n\n他低頭穿鞋。\n\n他把鞋帶綁得很慢，像還有話想說。\n最後只丟下一句：「那個……我明天九點走。」',opts:[['「你有必要現在才跟我說嗎？」','hurt','他停在門口：「我知道啦。這件事是我不好。」但還是沒說更多。'],['「……你明天路上小心。」','care','他回頭嗯了一聲，叫你別忘了幫九重葛澆水。'],['伸手抱他一下','hug','他僵了一秒，然後拍拍你的背：「欸，好啦，搬家又不是去火星。」']]},
{time:'星期一 · 23:16',title:'回家的樓梯',body:'阿岳搬去台中了。\n九重葛回到四樓。\n\n今天你又加班。\n走到樓梯口時，你發現四樓暗暗的。\n你摸到牆邊的開關。\n\n喀。\n\n燈亮了。\n\n這時手機震動。\n「欸，九重葛有澆水嗎？不要又澆到爛掉欸。」\n\n你扶了一下花盆，發現底下那個接水盤還是他買的。',opts:[['「有啦，你很煩欸。」','joke'],['「欸，謝謝你。」','soft'],['拍一張亮著的樓梯燈傳給他','light']]}],
reveal:'一個月前，公司通知阿岳調去台中。\n他坐在陽台，看著九重葛。\n\n朋友問：「怎麼不跟樓下那個講？」\n「就因為很熟，才不知道怎麼講啊。」\n\n那天你加班到很晚。\n阿岳聽到熟悉的腳步聲，先走出房門，輕輕按亮四樓樓梯間的燈。\n\n不是那一天而已。\n\n六年裡，他有好多個晚上都這樣。\n你回到家時，看見的往往已經是一條亮著的路。\n\n要搬走的前一天，他在玄關站了很久。\n「靠，以後誰幫這個白癡開燈。」\n\n他沒有把這件事告訴你。'},
{id:'seat',name:'留給你的空位',tag:'他的故事 · 第一個視角',emoji:'🎟️',more:'兩張車票、一個沒坐下來的人，和一句始終沒問出口的話。',steps:[{"time":"三個禮拜前 · 18:05","title":"原來是他先說想去的","body":"阿禾滑手機，突然把天文館的照片推給你。\n\n「欸，這個重新開幕了，一起去看看？」\n\n你笑他明明最討厭排隊。\n他說：「就是想看看它有多爛啊。」\n\n你們翻開行事曆，找到同一個空著的星期六。\n你心想：這次，是他先邀我的耶。","opts":[["「去完一起吃拉麵。」","ramen","他說要吃辣的。你甚至查了餐廳營業時間。"],["「我買車票，你找展覽。」","tickets","你已經在想像回程要一起吐槽什麼。"],["「你真的要跟我去喔？」","invite","「不然我問鬼喔？」他翻了個白眼，你笑得很開心。"]]},
{time:'星期六 · 09:17',title:'一張沒有指定座位的票',body:'你們約好去看海邊那座很老的天文館。\n\n三個禮拜前是阿禾自己說的：「聽說整修好了，去看看？」\n\n你查車次、買票，還記得他討厭七點起床。\n\n出門前，你把兩張車票拍給他。\n\n他回：「欸，我今天精神真的很差。」\n\n過了兩分鐘，又補：「你自己先去，不用等我。」\n\n窗外的太陽很好。你突然不太想出門了。',opts:[['「我其實是想跟你一起去，不是想看天文館。」','honest','手機安靜了一會。他沒有立刻說抱歉。你第一次把想要的事情講得這麼直接。'],['「好啊，我自己去。」把另一張票收起來。','quiet','你打出很輕鬆的兩個字，卻盯著那個對話框好幾分鐘。'],['「你上次明明說想去。」','hurt','你不想再裝作沒關係。他讀了訊息，回了一個「我知道」。']]},
{time:'星期六 · 10:23',title:'海風大得很過分',body:'你還是上車了。\n\n旁邊的位置空著。\n\n一個阿姨上車時指著座位：「這裡有人嗎？」\n你停了一下。\n\n「沒有。」\n\n她坐下來，打開一包水果糖，硬塞給你兩顆。\n「坐車吃這個，比較不會暈。」\n\n你其實不暈車。\n\n手機亮起。阿禾問：「你有上車？」',opts:[['拍窗外的海給他：「快到了。」','photo','他傳來：「靠，天氣也太好了吧。」你們像平常一樣說了句廢話。'],['「有。可是旁邊沒有你。」','honest','他回覆得很慢：「我知道。」你看不出那句話是什麼表情。'],['「你先好好休息，我晚點再跟你講。」','care','他只回：「好。」沒有多加解釋，卻很快讀了你的下一張照片。']]},
{time:'星期六 · 12:46',title:'那台壞掉的星球機',body:'天文館不如你想像中漂亮。\n\n入口的地球模型正在維修，星空影片還延遲了十五分鐘。\n\n你在紀念品店看到一台旋轉的小型星球機。\n三年前，你和阿禾曾經在一間餐廳看到類似的東西。\n那時他說：「這什麼幼稚鬼玩具。」\n十分鐘後卻偷偷按了三次開關。\n\n你拿起一台，售價比想像中貴。\n\n店員問：「送人的嗎？」',opts:[['「不是，買給自己的。」放回架上。','quiet','你笑了笑。原來有些記憶即使不買下來，也不會消失。'],['買一張很醜的星座貼紙，拍給阿禾。','joke','他秒回：「不要亂買。」然後又問：「有沒有比較醜的？」'],['傳：「欸，這個你一定會喜歡。」','photo','你等了一會，收到一句：「你怎麼還記得那個。」']]},
{time:'星期六 · 18:39',title:'樓下那台販賣機',body:'回到家，你在樓下販賣機前找零錢。\n\n阿禾剛好從樓梯走下來，頭髮亂得像剛睡醒。\n手裡拿著一把便利商店雨傘。\n\n「你回來了喔？」\n\n「嗯。」\n\n他看了一眼你手裡的車票。\n\n「好玩嗎？」\n\n你說了展覽延遲、阿姨塞水果糖、還有那台很醜的星球機。\n\n他笑出了聲。\n然後突然問：「那個……你今天是不是很失望？」',opts:[['「是啊，但我知道你今天很累。」','honest','他點點頭：「嗯。可是我也有想去。」他沒有承諾下次一定能去。'],['「你覺得呢？」','hurt','他一下子不知道怎麼回答。「我不是故意讓你等啦。」你們都不太滿意這句話。'],['「下次你安排，我什麼都不查。」','invite','他愣一下：「你很敢欸，說不定會搭錯車。」你說：「就搭錯啊。」']]},
{time:'星期日 · 21:08',title:'原來有人記得',body:'隔天，阿禾在門口丟給你一個紙袋。\n\n「你昨天不是說車上阿姨給你水果糖？」\n\n裡面是兩包同樣的糖。\n\n「這個……昨天的事我有想過。是我不好。」\n\n你翻到紙袋底部，發現一張手寫紙條。\n\n「昨天是我先約你的，卻讓你自己去了，對不起。下次讓我來安排，我想好好跟你一起出去。」\n\n你抬頭。\n他已經轉身走到樓梯口。\n\n「欸，糖不要一天吃完，很甜。」',opts:[['「那換你找一天，帶我出去。」','invite','他回頭點頭：「好。這次我來查時間跟車票，確定了再約你。」'],['「欸，我其實昨天很想你。」','honest','他站住。半晌只說：「……我知道啦。」然後把紙袋提把幫你折好。'],['「這糖明明很難吃欸。」','joke','他笑出聲：「靠！難吃還我啊。」你把糖藏到背後。']]}],
reveal:'星期六早上，阿禾把兩張車票的截圖看了很久。\n\n他前一晚沒睡好，原本以為只要說「你自己先去」，就不會拖累你的行程。\n\n可他忘了，你買票不是因為缺一個人湊優惠。\n\n下午，他重新查了去海邊的班車，卻沒有訂票。他怕答應了又做不到。\n\n你提到車上的水果糖時，他其實記住了。\n隔天路過商店，看見糖就買了兩包。\n\n他沒有因此變得很擅長陪伴；你也沒有因此不再想被主動選擇。\n只是那天，你們終於讓彼此多知道了一點。'},
{id:'otherbank',name:'沒有寄出的邀請',tag:'他的故事 · 另一個視角',emoji:'🌊',more:'同一趟海邊旅行，從那個留下來的人開始。',steps:[{"time":"三個禮拜前 · 18:05","title":"那個邀請是你說的","body":"你看到天文館重新開幕的照片。\n突然想起阿衡以前笑你玩星球機很幼稚。\n\n你自己問：「欸，要不要找一天去？」\n\n阿衡立刻拿出手機查車次，眼睛亮亮的。\n你其實有點開心，有人這麼期待你提議的事情。\n\n他問星期六可不可以。你點了頭。","opts":[["「回程搭慢車，一起看海。」","train","阿衡笑說你難得會安排。你心裡卻有點得意。"],["「去完吃拉麵？」","ramen","他馬上查附近餐廳，還問你吃不吃辣。"],["「欸，說好真的要去喔。」","promise","他在行事曆畫了一顆星，你看見了。"]]},
{time:'星期五 · 23:58',title:'已讀之前',body:'你叫阿禾。\n\n三個禮拜前，是你先約阿衡去海邊天文館。\n他後來把兩張車票買好了。那天你是真心想去的。\n\n可是這週事情多到你快喘不過氣。\n你終於回到家，連澡都懶得洗。\n\n阿衡又傳來：「我查好明天的交通了，起床打給你！」\n\n你看著訊息，忽然覺得明天的自己大概連說話都沒力氣。\n\n現在手機就在你手上。',opts:[['「欸，我明天可能真的沒力氣，你會失望嗎？」','honest','你看著送出去的訊息，心臟跳得有點快。他回：「會啊，因為我很期待跟你一起。」'],['先不講，明天醒來再決定。','quiet','你把手機蓋住。不是沒想到他，只是你現在真的不知道怎麼回。'],['傳一句：「我今晚真的好累，明早再跟你說好嗎？」','distance','你按了送出，想著明早要好好跟他講，卻還是怕看到他的失望。']]},
{time:'星期六 · 09:17',title:'你自己先去',body:'早上醒來，陽光照在你臉上。\n\n阿衡傳了兩張車票的照片。\n\n你知道他為這趟旅行查了好多東西。\n你也知道他討厭別人臨時變卦。\n\n可是你想到人群、火車、排隊，胃裡就縮了一下。\n\n最後你打字：「我今天精神真的很差。」\n「你自己先去，不用等我。」\n\n對話框安靜了。\n你忽然想知道他會不會生氣。',opts:[['「我不是不想跟你去，是我今天真的撐不住。」','honest','你把話講清楚了，但這不保證他就不失望。'],['收起手機，先去睡。','quiet','你睡不著，卻也沒有力氣把訊息重新打開。'],['補一句：「對不起。」','care','他回你：「我知道。」你不知道自己能不能接住他的失望。']]},
{time:'星期六 · 12:51',title:'星球機',body:'你起床喝水，翻到三年前的一張舊照片。\n\n是一台小小的星球機，一按就會把滿天星星投在天花板。\n\n你想起三年前那間餐廳。\n你明明嘲笑那東西幼稚，卻忍不住玩了好幾次。\n\n你甚至忘了自己曾經說過這件事。\n\n而他還記得。\n\n你很想傳給阿衡：「我還記得那個。」\n手指停在鍵盤上。',opts:[['傳：「欸，還記得這個嗎？幼稚鬼。」','joke','阿衡回：「不知道誰當時玩得最開心喔。」你站在廚房笑出聲。'],['傳：「天文館好玩嗎？你有吃飯嗎？」','care','他傳來一堆展覽抱怨，你很認真看完，也想著下次換你安排。'],['把照片收起來，晚點再跟他聊。','quiet','你沒有立刻打擾他，可是那張照片讓你想到原本想一起走的那段海邊。']]},
{time:'星期六 · 18:39',title:'下樓買水',body:'下午你終於睡飽，下樓買水。\n\n在販賣機前遇到剛回家的阿衡。\n\n他像平常一樣講幹話，抱怨展覽不好看，還說車上的阿姨強迫餵他水果糖。\n\n你一邊笑，一邊注意到他的車票折出了一道很深的摺痕。\n\n那本來應該是你們兩個人的下午。\n\n你很想說些什麼，又怕自己一開口就像在承諾下一趟一定會去。',opts:[['「欸，你今天是不是很失望？」','honest','他看著你：「當然啊。」沒有罵你，但也沒有假裝沒事。'],['「那阿姨給你的糖好吃嗎？」','joke','他說難吃得要命，卻把口袋剩下一顆拿出來給你。'],['「下次換我找個地方，好不好？」','invite','他抬頭：「真的？」你說：「我找看看。」你知道這句話得認真對待。']]},
{time:'星期日 · 21:08',title:'那兩包糖',body:'今天你路過一間商店。\n架上有兩包和昨天那位阿姨給阿衡一樣的水果糖。\n\n你拿起來，想起他昨天講故事時的表情。\n\n你沒有辦法補回那趟旅行。\n但你是真的很喜歡聽他講那些無聊的小事。\n\n你買了糖，寫一張字條，放進紙袋。\n\n現在站在阿衡門口，你忽然又不太想按門鈴。\n\n因為你不確定他還會不會願意邀請你。',opts:[['按門鈴：「欸，我有東西給你。」','care','他一開門就問你是不是來討債。你把紙袋塞給他，忍不住笑。'],['敲門後說：「昨天的事，我想再講一下。」','honest','他把門拉開一點，讓你進去。你們沒有立刻談完，但這次你沒有消失。'],['把紙袋放門口，傳訊息叫他拿。','quiet','你聽見屋裡傳來拖鞋聲。還沒走遠，他就傳了句：「這什麼啦！」']]}],
reveal:'同一個星期六，阿衡坐上了往海邊的火車。\n\n他旁邊的位置空著。阿姨問可不可以坐，他說「可以」。\n\n他其實沒那麼想看天文館。他最期待的是回程時跟你一起吐槽展覽有多爛。\n\n他有點生氣，有點委屈，但仍然在紀念品店看到幼稚的星球機時，第一個想起你。\n\n他沒有要求你變成一個永遠有力氣陪伴的人。\n他只是希望，下次你想到他時，能讓他知道。\n\n而你也有權利說累、說不想去、說需要自己待著。\n這兩份需要，不必用誰比較愛誰來決勝負。'}

{"id":"rainradio","name":"天氣好的時候","tag":"有些親近，停在一則天氣訊息","emoji":"🌦️","more":"他們曾經一起等雨停，後來只剩下偶爾分享的天空。","steps":[{"time":"初夏 · 星期六 15:26","title":"再等五分鐘","body":"小朔跟小言在舊書市集被午後雷雨困住。\n\n兩個人擠在窄窄的騎樓下。小言把手裡的紙袋護進外套，裡面是小朔剛買的絕版漫畫。\n\n「你自己的書都濕了欸！」\n「你那本比較貴啊。」\n\n小朔忍不住笑。\n雨太大，沒有人走得了。小言突然說：「下次來，你挑書，我找吃的。」\n\n小朔從沒想過，自己會開始期待一個普通的星期六。","opts":[["「說好喔，下次換你約。」","invite","小言看了他一眼：「我記性很差欸。」說完卻把市集日期拍進手機。"],["「你幹嘛保護我的書？」","care","「因為你剛剛找這本找到像在尋寶。」小言把濕掉的袖子擰了擰。"],["「下次別來，下雨麻煩死了。」","joke","小言說：「好啊，那我們改去有冷氣的。」你們開始亂講一堆地方。"]]},{"time":"兩週後 · 19:17","title":"一張很醜的天空","body":"你們並沒有天天聊天。\n\n小言卻偶爾傳來照片：路邊的雲、錯得離譜的路牌、便利商店門口睡覺的狗。\n\n今天他傳來一張灰得像水泥牆的天空。\n「這看起來會下雨嗎？」\n\n小朔回：「你問我幹嘛，我又不是氣象局。」\n\n三秒後，他又傳：「你上次說的那家麵店，我查到了。」","opts":[["「好啊，那什麼時候去？」","invite","小言說最近班表很亂，確認後再講。你等了一會，沒有追問。"],["傳一張自己窗外的天空回去","photo","他回：「你那邊比較漂亮。」小朔看著兩張很普通的照片笑了。"],["「你其實是想找我聊天吧？」","tease","小言傳了一個翻白眼的貼圖，過幾秒又問：「你吃晚餐了沒？」"]]},{"time":"入秋 · 星期五 22:04","title":"說好了，卻沒有日期","body":"以前你們會說很多廢話。\n現在小言回訊息變慢了。\n\n你還記得他答應找一天去吃麵，但一直沒說哪天。\n你終於問：「我們是不是變得不太一樣了？」\n\n他過了很久才回：「最近真的很累，事情很多。我不是故意不回。」\n\n窗外雨聲開始大起來。\n你握著手機，不知道該從哪一句開始。","opts":[["「我不是要你一直回，我只是有點想你。」","honest","訊息被讀了。半小時後他回：「我知道。只是我不知道怎麼回得好。」"],["「如果不想約了，直接跟我說也沒關係。」","direct","他回：「不是討厭你。但我現在真的沒辦法像之前那樣。」讀完你安靜了好久。"],["先不回，去煮一碗麵","quiet","水滾的時候你突然想起，最早明明只是想找個人一起吃飯。"]]},{"time":"星期日 · 16:38","title":"轉角那間麵店","body":"小朔一個人路過那家說好要一起去的麵店。\n玻璃窗上貼著：「本週最後營業日」。\n\n你差點拿起手機拍給小言。\n手都抬起來了，又停住。\n\n店裡老闆娘問：「一位嗎？」\n你點頭。\n\n端上來的麵很燙，辣得你一直喝水。\n你想到如果小言在，一定會笑你不會吃辣還硬點。","opts":[["拍麵傳給他：「真的很好吃欸。」","photo","他沒有馬上回，你把手機扣下來，先把麵吃完。"],["「一位。」然後把手機收起來","solo","窗邊的光照在桌上。你還是覺得這碗麵很好吃。"],["打字：「我其實希望今天有你。」","honest","你看了很久才傳出去。這句話沒有替對方安排任何答案。"]]},{"time":"星期一 · 18:11","title":"一個不太適合的邀請","body":"小言突然傳來：「我看到你說那間店要關了。」\n\n他又傳：「抱歉，最近真的沒力氣維持以前那種聊天。」\n\n「我不是沒記得你。可是我現在能給的可能就這樣。」\n\n小朔盯著這段話。\n從前那場雨、紙袋、兩張灰灰的天空，全都還在手機裡。\n\n你既覺得他終於說清楚了，又有一點失落。","opts":[["「謝謝你說清楚。我需要的可能不只這樣。」","boundary","小言回：「我知道。」你們沒有吵架，卻都沉默了。"],["「那至少偶爾還能互傳醜照片吧。」","small","他說：「可以啊。」你也知道這不一定等於以前的親密。"],["「其實那時候我真的很開心。」","memory","過了很久，他回：「我也是。」就只有這三個字。"]]},{"time":"下一個雨天 · 17:32","title":"外套口袋裡的收據","body":"下雨了。\n\n小朔翻外套找悠遊卡，摸出一張皺巴巴的紙。\n是那次舊書市集的收據。\n背面被小言亂畫了一隻很醜的青蛙。\n\n那天他們在騎樓躲雨，誰也沒想到會變成後來的樣子。\n\n手機震動。\n小言傳來一張照片，是雲層裂開的一小塊藍天。\n「今天這張沒有很醜吧？」\n\n小朔看了一會。","opts":[["「有比較好一點啦。」","joke","他回了一個笑臉。沒有新約定，但這一刻真的有人在分享天空。"],["「那隻醜青蛙我還留著。」","memory","小言回：「靠，你竟然沒丟。」兩個人都想起了那天的雨。"],["先把收據放回口袋","quiet","你沒有立刻回覆。雨還在下，麵店的味道卻突然很清楚。"]]}],"reveal":"初夏那天，小言把小朔的漫畫塞進外套，自己的書被雨淋皺了角。\n\n他真的很喜歡那段一起亂逛的時間。\n後來他生活裡的事情漸漸擠在一起，看到小朔的訊息，常常不知道該怎麼回，才不會讓一段簡單的聊天變成新的期待。\n\n有幾次，他打了「下星期去吃麵？」又刪掉，因為他知道自己還不能確定會不會到。\n\n他不想說謊，也沒有勇氣太早說清楚。\n等真正開口時，那家麵店已經關了。\n\n有些在乎是真的，有些無法給予也是真的。小朔所等待的那頓飯，並沒有因為小言記得一片雲就被補回來。"},
{"id":"tide","name":"退潮之後","tag":"有些靠近很真，分開後卻仍然安靜","emoji":"🌊","more":"海邊那天他把外套借給你，回到城市後卻很少主動傳訊息。","steps":[{"time":"星期六 · 14:18","title":"最後一班接駁車","body":"阿澄到海邊參加攝影散步，路不熟，差點錯過最後一班接駁車。\n\n小遠坐在站牌旁，看他拿著手機找路。\n「欸，這班不是去海邊，是回車站的。」\n\n你們最後乾脆一起走向海岸。\n走到防波堤時，風把你的帽子吹走，小遠跑得差點踩進水裡。\n\n「我只是想拍照，不是來比賽追帽子欸！」\n\n你們笑到停不下來。","opts":[["「帽子救回來了，請你喝飲料。」","care","小遠說：「那我要最貴的。」最後卻選了最普通的紅茶。"],["「你剛剛跑超醜。」","joke","他說：「那下次你自己去追。」講完把帽子扣回你頭上。"],["「下次還要一起來拍照嗎？」","invite","他想了一下：「可以啊，這邊日落真的不錯。」"]]},{"time":"星期六 · 18:42","title":"風變涼的時候","body":"天慢慢暗了。\n\n你們坐在堤防上，聊到各自喜歡的地方、常去的店，還有很想做但一直沒去做的事。\n\n海風突然變冷。\n小遠把自己的外套放到你腿上。\n「你穿啦，我等一下坐車比較不冷。」\n\n你問他：「那你呢？」\n「我比你耐冷啊。」\n\n然後他自己打了一個超大噴嚏。","opts":[["「耐冷個屁。」把外套分一半給他","share","你們各抓著外套一角，笑著擠在一起。"],["「欸，你其實人很好欸。」","soft","他說：「你現在才發現？」語氣很跩，耳朵卻有點紅。"],["「那你靠過來一點啊。」","near","他看了你一下，真的往旁邊挪了幾公分。"]]},{"time":"星期日 · 23:08","title":"昨天和今天","body":"回到城市以後，你們傳了幾張照片。\n\n小遠說你拍海的照片很好看，還留了一張當桌布。\n你突然覺得和這個人相處很輕鬆。\n\n你傳：「欸，下次你有空再一起去哪裡？」\n\n訊息已讀。\n半夜他回：「好啊，等我忙完。」\n\n你盯著那句話。它很友善，也沒有日期。","opts":[["「好啊，你有空再找我。」","space","你決定不替他排時間，但還是會期待通知跳出來。"],["「下星期三可以嗎？」","invite","他回：「那天不行，工作很滿。」沒有另外提日期。"],["傳一張他打噴嚏的糊照","joke","他秒回：「幹你刪掉。」你笑了，卻仍然不知道下次何時見。"]]},{"time":"下個星期五 · 20:16","title":"兩個人的照片","body":"你在整理相簿，看到小遠把帽子塞回你頭上的照片。\n他當時笑得很近。\n\n朋友問：「欸，你最近怎麼一直看那張？」\n\n你也不知道怎麼解釋。\n那個下午確實很好。\n但小遠這週沒有主動找你。\n\n你打開他的聊天視窗，又關掉。","opts":[["「他那天真的很可愛。」","admit","朋友笑你：「你這個臉已經回答了啦。」"],["把手機收起來，跟朋友去吃晚餐","life","餐廳很吵，你還是有笑、有吃、有參與這個晚上。"],["傳一句：「欸，那件外套你拿回去沒？」","contact","小遠回：「有啦。」又補：「你怎麼突然問這個？」"]]},{"time":"隔週 · 星期二 19:34","title":"突然亮起的訊息","body":"你剛下班，手機亮了。\n\n小遠傳來一張天空照片：「你看，今天的雲跟那天海邊很像。」\n\n他沒有提到下次見面。\n你卻一下子想起他奔跑追帽子的樣子。\n\n他又傳：「我今天真的累爆。」\n\n你忽然有點想直接問：你有沒有想跟我再見？","opts":[["「你下次想去海邊，換你約我。」","clear","他回：「好啊，我有空會跟你講。」這不是承諾某一天，但你講清楚了。"],["「你今天辛苦啦。先去吃飯。」","care","他回：「你也是。」你決定今晚先照顧自己的生活。"],["「我覺得那天跟你一起很開心。」","honest","他回：「我也是。」你看著這句話，沒有急著把它讀成更多。"]]},{"time":"星期六 · 17:55","title":"沒有約好的日落","body":"今天傍晚天色很好。\n你本來想一個人去附近看夕陽。\n\n打開相簿時，看到小遠那張很醜的打噴嚏照片，忍不住笑出聲。\n\n他那天確實靠過來、把外套給你、跟你聊了很久。\n那些事情並不因為他這週沒約你而變成假的。\n\n但現在，想不想再次見面，仍然需要他自己做出選擇。\n\n你穿上鞋。手機就在口袋裡。","opts":[["自己出去看夕陽，晚點再回訊息","go","外面風很舒服。你並沒有忘記那天，只是今天也有今天。"],["把糊照傳過去：「這個人欠我一次日落。」","joke","他回一個快笑死的貼圖：「那張到底什麼時候刪？」"],["傳：「如果哪天你也想見我，就找我。」","open","按下傳送後，你的心跳很快。但你沒有替他決定答案。"]]}],"reveal":"在海邊那天，小遠真的很享受和阿澄待在一起。\n\n阿澄笑起來很直接，也不介意和他一起做些蠢事。他追帽子時其實自己也笑到不行。\n\n回到城市以後，他把一張海邊照片存成桌布。那個瞬間是真的。\n\n但小遠也知道自己現在生活很滿，不確定是否願意維持固定的見面與聯絡。\n他打開過幾次聊天視窗，想發張天空照片，又覺得沒有新鮮事。\n\n最後，他還是傳了那張雲的照片。\n\n他記得阿澄，但還沒有安排下次見面。這不是阿澄可以靠更努力聊天就補上的空白。"}
];
const reflectionScenes={"pot":{"time":"星期五 · 22:14","title":"桌上還放著那張訂位截圖","body":"朋友離開後，你坐回客廳，外套還沒脫。\n\n手機的行事曆還寫著：19:30，火鍋。\n你記得星期三下雨時，他把傘往你這裡挪，還一本正經地說只准偷一片肉。\n\n那時候，你連要點什麼湯底都想好了。\n\n你把手機放在桌上。螢幕暗了，又亮起。","object":"手機上那張兩人座的訂位截圖","memory":"雨聲、兩顆蛋，以及他問你星期五想吃什麼湯底的聲音"},"light":{"time":"星期一 · 23:18","title":"樓梯間忽然安靜了","body":"你回到四樓，鑰匙碰到門鎖，發出一點聲音。\n\n以前這個時候，偶爾還會聽見樓上傳來阿岳罵電視的聲音。\n\n九重葛還放在原來的位置。\n你想到三年前颱風剛走，你們滿手泥巴地把它搬上樓。他還笑你跟一盆花打架。\n\n你摸到牆上的開關，手卻停了一下。","object":"九重葛旁邊那圈淡淡的水痕","memory":"三年前颱風過後，阿岳穿拖鞋下來幫你搬花盆"},"seat":{"time":"星期日 · 22:06","title":"那張票還夾在手機殼裡","body":"房間的燈沒關。\n\n你拿出手機，兩張車票的截圖還在相簿裡。\n三個星期前，阿禾把天文館的照片拿給你看，說：「一起去看看？」\n\n你記得自己開始查車次，甚至想好回程要跟他抱怨展覽有多爛。\n\n星期六已經過去了。\n你把手機扣在床上，又忍不住拿起來。","object":"當初兩個人一起看的天文館照片","memory":"三個星期前，阿禾主動問你要不要一起出去的聲音"},"otherbank":{"time":"星期日 · 22:06","title":"行事曆裡那顆星星","body":"店裡已經打烊，你把鐵門拉下一半。\n\n手機行事曆裡，星期六還畫著一顆星星。\n你想起三個星期前，是自己問阿衡要不要去天文館。\n\n他當時笑得很開心，立刻開始查車次。\n你原本也期待一起搭火車看海。\n\n昨天晚上，你卻一個人坐在家裡。\n你摸了摸口袋裡沒寄出的明信片。","object":"星期六行事曆上畫的星星","memory":"你主動邀他去天文館時，阿衡一下子亮起來的眼神"},"rainradio":{"time":"雨停之後 · 19:04","title":"那張收據還在","body":"你回到家，把外套掛起來。\n\n收據從口袋裡掉出來。上面有一隻小言畫的醜青蛙。\n\n你記得第一次躲雨時，他把你的書護進外套。那天你真的期待以後還會有很多這樣的下午。\n\n窗外還在滴水。手機安安靜靜的。","object":"畫著醜青蛙的舊收據","memory":"騎樓底下的大雨，還有那句『下次我找吃的』"},"tide":{"time":"星期六 · 20:46","title":"那張被風吹歪的照片","body":"你回家把鞋子踢到玄關。\n\n相簿裡的第一張，就是那天小遠追帽子時被風吹得很糊的照片。\n\n你記得他把外套披過來，也記得兩個人坐在海邊笑到停不下來。\n\n你當時真的覺得，下次一定還會有這樣的下午。","object":"海邊那張模糊的合照","memory":"帽子差點掉進海裡，以及他笑著把帽子扣回你頭上的動作"}};
const closingScenes={"pot":"隔天，你打開冰箱，看見昨晚沒煮的水餃。\n\n手機上有他傳來的一句：「我昨天講得不好。你今天要不要先一起吃飯？」\n\n你還沒有回。\n但那個晚上，你想要的從來不只是一鍋肉。","light":"隔天的四樓安安靜靜。\n\n你替九重葛加了點水，阿岳傳來一張台中租屋處亂七八糟的照片。\n\n「這邊樓梯超爛。比你那棟還爛。」\n\n你笑了一下。下樓時，把門輕輕帶上。","seat":"星期三晚上，阿禾傳了一張列車時刻表。\n\n「下下週六你有沒有空？我先確定好時間，這次換我買票。」\n\n你沒有立刻忘記上次的失望。\n但這一次，你不用自己先把整天排好。","otherbank":"星期三晚上，你打開時刻表，挑出自己真的有空的一天。\n\n你把車次傳給阿衡：「下下週六，要不要一起去？票我來買。」\n\n按下傳送之後，你有點緊張。\n這次不是讓他猜，而是你真的開口了。","rainradio":"隔天，小朔把醜青蛙收據夾進那本舊漫畫。\n\n小言又傳了一張天氣照。\n\n這一次，小朔先把書看完，才慢慢回他。\n\n那碗錯過的麵沒有吃成，但未來的日子，也還有其他人可以一起吃飯。","tide":"傍晚你走到河堤，天空有一大片橘色的光。\n\n手機沒有新的邀約。\n\n你拍了張照片，先留在自己的相簿。\n\n那天的海風很好，今天的也很好。"};
const memorySeeds={"pot":["那個星期三，他把雨傘往你那邊挪，還問你要什麼湯底。你記得他主動邀約時，自己心裡突然有多開心。","那張星期五晚上七點半的行事曆"],"light":["三年前颱風過後，你們一起把花盆扶正。那天只覺得他嘴巴很壞，誰知道這會成為三年的習慣。","那盆九重葛留下的水痕"],"seat":["你記得他第一次把天文館照片推到你面前時的表情。星期六在發生以前，已經讓你期待了三個禮拜。","那張沒有用到的車票"],"otherbank":["那天下午是你先提出邀請的。你記得阿衡聽見時眼睛一亮，也記得自己其實很想跟他一起去。","那份畫著星星的行事曆"],"rainradio":["你一直記得那個市集雨天。也記得某些日常訊息曾讓你覺得被惦記。","那張畫著醜青蛙的收據"],"tide":["你原本以為海邊那天只是一次散步，後來才發現自己很期待有人也想再次見到你。","那張被風吹糊的照片"]};
let active=null,idx=0,log=[],revealed=false,endingPhase=0,originalWords='',closingWords='',pendingResponse=null;const $=id=>document.getElementById(id);
function esc(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){active=null;$('home').style.display='block';$('story').style.display='none';history.replaceState({},'',location.pathname)}
function start(id){active=stories.find(x=>x.id===id);idx=0;log=[];revealed=false;endingPhase=0;originalWords='';closingWords='';pendingResponse=null;$('home').style.display='none';$('story').style.display='block';history.replaceState({},'','#'+id);render()}
function pick(label,tag){const opt=active.steps[idx]?.opts.find(a=>a[0]===label);log.push({label,tag});if(opt?.[2]){pendingResponse={text:opt[2],time:active.steps[idx].time,title:active.steps[idx].title};}else{idx++;}render();window.scrollTo(0,0)}
function render(){if(!active)return;
if(pendingResponse){
$('count').textContent='選擇的回應';
$('bar').value=idx/active.steps.length*100;
drawForScene(active.id,idx);
$('time').textContent=dateForStory(active.id,idx,pendingResponse.time);
$('title').textContent=pendingResponse.title;
$('text').textContent=pendingResponse.text;
$('choices').replaceChildren();$('extra').replaceChildren();
const b=document.createElement('button');b.className='choice';b.textContent='繼續故事  ›';b.onclick=()=>{pendingResponse=null;idx++;render();window.scrollTo(0,0)};$('choices').appendChild(b);
$('footnote').textContent='這段回應發生在你剛剛做出選擇的那個時刻。';
return;
}
let end=idx>=active.steps.length;
$('count').textContent=end?'終章':(idx+1)+' / '+active.steps.length;$('bar').value=end?100:idx/active.steps.length*100;
drawForScene(active.id,idx);
$('extra').innerHTML='';$('choices').innerHTML='';
if(!end){let s=active.steps[idx];$('time').textContent=dateForStory(active.id,idx,s.time);$('title').textContent=s.title;
$('text').textContent=s.body;
s.opts.forEach(a=>{const b=document.createElement('button');b.className='choice';b.textContent=a[0]+'  ›';b.onclick=()=>pick(a[0],a[1]);$('choices').append(b)});
$('footnote').textContent='沒有所謂正確選項。故事裡的人也有自己的需要。'}else {
drawForEnding(active.id,endingPhase);
const box=$('extra'),seed=memorySeeds[active.id]||['你記得那天原本有多期待。','那件你留下的小東西'];
$('time').textContent=(reflectionDates[active.id]||'故事裡的一天')+(endingPhase===2?'・另一個人的視角':endingPhase===3?'・尾聲':'');
if(endingPhase===0){
const scene=reflectionScenes[active.id]||reflectionScenes.seat;
$('time').textContent=reflectionDates[active.id]||scene.time;
$('title').textContent=scene.title;
$('text').textContent=scene.body;
const b=document.createElement('button');b.className='scene-next';b.textContent='把那件東西拿起來  →';b.onclick=()=>{endingPhase=1;render();window.scrollTo(0,0)};box.appendChild(b);
$('footnote').textContent='';
}else if(endingPhase===1){
const scene=reflectionScenes[active.id]||reflectionScenes.seat;
$('time').textContent=scene.time;
$('title').textContent=scene.object;
$('text').textContent='你望著'+scene.object+'。\n\n'+scene.memory+'。\n\n你沒想到自己會把這件小事記得這麼清楚。\n\n有些話那時候沒講，現在房間裡只剩下你。';
const p=document.createElement('p');p.className='note';p.textContent='你拿起手機，打了一段字。這次，沒有一定要傳出去。';box.appendChild(p);
const ta=document.createElement('textarea');ta.placeholder='欸，其實那天我……';ta.value=originalWords;box.appendChild(ta);
const next=document.createElement('button');next.className='primary';next.textContent='把手機放下';ta.oninput=()=>{originalWords=ta.value};next.onclick=()=>{originalWords=ta.value;endingPhase=2;render();window.scrollTo(0,0)};box.appendChild(next);
$('footnote').textContent='你可以留白，也可以寫下任何話。';
}else if(endingPhase===2){
$('title').textContent='你想說的話，已經留下。';
$('text').textContent=''+(originalWords.trim()?'「'+originalWords+'」\n\n':'')+'你把手機放在一旁。房間裡安靜了一會。\n\n至於他那一天經歷了什麼，你現在還不知道。就算知道了，你的失望也不會因此變成假的。';
if(!revealed){const see=document.createElement('button');see.className='primary';see.textContent='看看他的那一天';see.onclick=()=>{revealed=true;render();window.scrollTo(0,0)};box.appendChild(see)}
else{const div=document.createElement('div');div.className='reveal';div.textContent=active.reveal;box.appendChild(div);const advance=document.createElement('button');advance.className='primary';advance.textContent='帶著兩邊的故事繼續走';advance.onclick=()=>{endingPhase=3;render();window.scrollTo(0,0)};box.appendChild(advance)}
$('footnote').textContent='隱藏視角不是替任何人的行為開脫。';
}else{
$('title').textContent='故事還在繼續。';
$('text').textContent=closingScenes[active.id]||'日子仍然在往前走。';
const authorCard=document.createElement('section');authorCard.className='author-note';authorCard.innerHTML='<div class="author-label">寫故事的人想說</div><p></p>';authorCard.querySelector('p').textContent=authorNotes[active.id]||'';box.appendChild(authorCard);
const ta=document.createElement('textarea');ta.placeholder='想對這段故事說些什麼？';ta.value=closingWords;ta.oninput=()=>closingWords=ta.value;box.appendChild(ta);
const save=document.createElement('button');save.className='primary';save.textContent='複製我的完整遊玩紀錄';save.onclick=()=>{closingWords=ta.value;const record=active.name+'\n'+log.map((x,i)=>(i+1)+'. '+x.label).join('\n')+'\n我的期待：'+originalWords+'\n最後：'+closingWords;navigator.clipboard.writeText(record).then(()=>save.textContent='已複製',()=>save.textContent='無法複製')};box.appendChild(save);
const ask=document.createElement('button');ask.className='primary';ask.textContent='讓 AI 聽聽我想說的話';ask.onclick=async()=>{closingWords=ta.value;if(!closingWords.trim()){status.textContent='先留一句想說的話，再讓我回應你。';return}ask.disabled=true;ask.textContent='正在讀你的故事……';status.textContent='';try{const resp=await fetch('https://love-stories-reply-api.onrender.com/api/respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({story:active.name,choices:log.map(x=>x.label),expectation:originalWords,words:closingWords})});const data=await resp.json();status.textContent=resp.ok?data.reply:(data.error||'暫時無法回應，稍後再試。')}catch(e){status.textContent='目前無法連接故事回應服務，稍後再試。'}finally{ask.disabled=false;ask.textContent='再聽我說一次'}};box.appendChild(ask);const status=document.createElement('div');status.className='reveal ai-reply';status.setAttribute('aria-live','polite');box.appendChild(status);
const back=document.createElement('button');back.className='secondary';back.textContent='回故事館';back.onclick=home;box.appendChild(back);
$('footnote').textContent='結局不是要你立刻做出決定。';
}
}}
$('tiles').innerHTML=stories.map(s=>'<button class="tile" data-id="'+s.id+'"><div class="art '+s.id+'">'+s.emoji+'</div><div class="detail"><span class="arrow">↗</span><strong>'+s.name+'</strong><small>'+s.more+'</small></div></button>').join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>start(b.dataset.id));$('homebtn').onclick=home;const hash=location.hash.slice(1);if(stories.some(s=>s.id===hash))start(hash);
$('tiles').insertAdjacentHTML('beforeend','<a class="tile" href="./chapter7.html" style="display:block;text-decoration:none"><div class="art" style="background:linear-gradient(155deg,#333b62,#8c789a 52%,#efb4a6);height:172px;display:grid;place-items:center;font-size:78px">🎟️</div><div class="detail"><span class="arrow">↗</span><strong>那晚的第二張票</strong><small>第七篇 · 少字漫畫互動短篇</small></div></a>');
</script></body></html>
