<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141626"><title>第八張照片｜欸，你幹嘛啦！</title><style>
*{box-sizing:border-box}body{margin:0;background:#141626;color:#f8efeb;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:550px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(30px + env(safe-area-inset-bottom))}nav{display:flex;align-items:center;justify-content:space-between;padding:18px 0;gap:8px}nav a,nav button{border:1px solid #ffffff50;background:#ffffff12;color:#f5e5df;border-radius:24px;padding:10px;text-decoration:none;font-size:13px}nav span{font-size:12px;color:#bdb5c4}progress{width:100%;height:4px;accent-color:#edb8a7;margin-bottom:15px}.frame{position:relative;aspect-ratio:4/3;border-radius:21px;overflow:hidden;background:#35384f;box-shadow:0 15px 40px #0008}.frame img{width:100%;height:100%;object-fit:cover;display:block}.frame:after{content:"";position:absolute;inset:60% 0 0;background:linear-gradient(transparent,#171a2b99)}.frame span{position:absolute;z-index:1;bottom:14px;left:17px;font-size:12px;letter-spacing:1px;color:#fff}.date{font-size:14px;color:#f4c5af;font-weight:700;margin:19px 2px 5px}.title{font:700 31px/1.4 ui-serif,Georgia,"Noto Serif TC",serif;margin:0 2px 14px}.story{font-size:17px;line-height:1.9;white-space:pre-line;margin:12px 2px 20px;min-height:45px}.choices{display:grid;gap:11px}.choice{width:100%;border:1px solid #f3d7c7;background:linear-gradient(120deg,#f1d3c6,#eab9b5);color:#30283b;text-align:left;padding:16px;border-radius:16px;font:650 16px/1.6 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;cursor:pointer;min-height:58px}.choice.ghost{background:#ffffff10;color:#f5ecea;border-color:#ffffff50}.choice:disabled{opacity:.55}.panel{border:1px solid #e8b7a955;border-radius:15px;background:#252a40;padding:18px;margin:17px 0;white-space:pre-line;line-height:1.85}.panel b{color:#f4c8b6}.author{border-left:4px solid #efb7a8}.entry{width:100%;background:#fff6ef;color:#2d2a38;border:0;border-radius:15px;padding:15px;min-height:105px;font:16px/1.7 -apple-system,BlinkMacSystemFont,sans-serif;resize:vertical;margin:12px 0}.reply:empty{display:none}.footer{color:#a2a0b1;text-align:center;font-size:12px;margin:36px 0}
</style></head><body><main><nav><a href="./">← 故事館</a><span>第七篇 · 寫實攝影短篇</span><button id="restart">重玩 ↺</button></nav><progress id="progress" max="100" value="0"></progress><div class="frame"><img id="image" alt="故事場景攝影"><span id="place"></span></div><div class="date" id="date"></div><h1 class="title" id="title"></h1><div class="story" id="story"></div><div class="choices" id="choices"></div><div id="extra"></div><div class="footer">虛構的故事 · 沒有正確答案</div></main><script>
const photos=["https://unsplash.com/photos/city-street-at-night-with-neon-lights-and-people-VlgYkk-CgwM/download?force=true&w=1200","https://unsplash.com/photos/young-man-in-glasses-holding-a-camera-at-night-tYuVXIXIs9M/download?force=true&w=1200","https://unsplash.com/photos/a-couple-of-people-walking-down-a-street-at-night-Vdifo5hCxCw/download?force=true&w=1200","https://unsplash.com/photos/a-dark-street-at-night-with-a-restaurant-lit-up-p4mo4gK4LDY/download?force=true&w=1200","https://unsplash.com/photos/a-blurry-photo-of-a-city-street-at-night-5bS1rBJBwY0/download?force=true&w=1200","https://images.unsplash.com/photo-1452587925148-ce544e77e70d?w=1200&auto=format&fit=crop&q=85","https://unsplash.com/photos/young-man-in-glasses-holding-a-camera-at-night-tYuVXIXIs9M/download?force=true&w=1200"];
const scenes=[
["10 / 10・星期六 18:22","你又在拍我","夜市入口","阿維拿著相機。\n小澤笑他：「你到底有沒有要一起玩？」",["「等我拍完這張啦。」","把相機收起來，去吃東西"]],
["10 / 10・星期六 19:11","最後一格","相機裡的底片","「剩最後一張了。」\n小澤伸出手：「那給我拍。」",["「你會拍嗎？」","把相機交給他"]],
["10 / 10・星期六 20:04","笑得太醜了","夜市轉角","你們坐在路邊吃炸雞。\n小澤忽然說：「欸，笑一個。」",["「不要啦，很醜。」","故意做鬼臉"]],
["10 / 12・星期一 18:40","沖洗好了","老街的相館","照片洗好了。\n老闆把信封推過來。",null],
["10 / 12・星期一 19:02","前七張","回家的路","七張照片，全是小澤。\n吃東西、走路、笑到彎腰。",null],
["10 / 12・星期一 19:04","第八張","最後一張照片","你把最後一張翻過來。\n竟然是你自己，笑得毫無防備。",["「靠，什麼時候偷拍的？」","把照片放進皮夾"]],
["10 / 13・星期二 21:18","他傳來一句話","訊息亮起的晚上","小澤傳訊息：\n「欸，那張你有看到嗎？」",["「有。你拍得不錯欸。」","「原來你也有在看我。」"]]
];
const hidden="那天小澤接過相機，沒有去拍夜市。\n\n他看著你在旁邊笑，突然想到：\n這個人拍了我好多次，卻幾乎沒有自己的照片。\n\n所以最後一格，他留給了你。\n\n他沒說。只是想讓你也留在那個晚上。";
const fallbackPhotos=["https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=1200&auto=format&fit=crop&q=85","https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=1200&auto=format&fit=crop&q=85","https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=1200&auto=format&fit=crop&q=85","https://images.unsplash.com/photo-1542038784456-1ea8e935640e?w=1200&auto=format&fit=crop&q=85","https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1200&auto=format&fit=crop&q=85","https://images.unsplash.com/photo-1452587925148-ce544e77e70d?w=1200&auto=format&fit=crop&q=85","https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=1200&auto=format&fit=crop&q=85"];
function setPhoto(i){const el=$("image");el.onerror=()=>{el.onerror=null;el.src=fallbackPhotos[i]};el.src=photos[i]}
const $=id=>document.getElementById(id);let n=0,stage=0,choices=[],words="",last="",shown=false;
function button(t,fn,ghost=false){const b=document.createElement("button");b.className="choice"+(ghost?" ghost":"");b.textContent=t;b.onclick=fn;$("choices").append(b);return b}
function move(){window.scrollTo(0,0)}
function show(){const c=$("choices"),e=$("extra");c.replaceChildren();e.replaceChildren();$("progress").value=n<scenes.length?n/scenes.length*100:100;
if(n<scenes.length){const s=scenes[n];setPhoto(n);$("place").textContent=s[2];$("date").textContent=s[0];$("title").textContent=s[1];$("story").textContent=s[3];if(s[4])s[4].forEach(t=>button(t,()=>{choices.push(t);n++;show();move()}));else button("繼續  ›",()=>{n++;show();move()});return}
setPhoto(stage===3?0:stage===2?6:5);$("place").textContent="故事之後";$("date").textContent="10 / 13・星期二 晚上";
if(stage===0){$("title").textContent="你也在照片裡";$("story").textContent="你看著第八張照片。\n原來，那晚不只你在看著他。";button("再看看那張照片  ›",()=>{stage=1;show();move()})}
if(stage===1){$("title").textContent="你想留下什麼？";$("story").textContent="有句話，不一定要傳出去。";const t=document.createElement("textarea");t.className="entry";t.placeholder="其實我想說……";t.value=words;t.oninput=()=>words=t.value;e.append(t);button("把這句話留下",()=>{words=t.value;stage=2;show();move()})}
if(stage===2){$("title").textContent=shown?"他眼裡的那個晚上":"你留下的話";$("story").textContent=words?"「"+words+"」":"照片還放在桌上。";if(shown){const p=document.createElement("div");p.className="panel";p.textContent=hidden;e.append(p);button("帶著這張照片繼續走",()=>{stage=3;show();move()})}else button("看看他的那一天",()=>{shown=true;show();move()})}
if(stage===3){$("title").textContent="第八張照片";$("story").textContent="你們還會不會一起出去，不知道。\n但那一晚，兩個人都在照片裡。";const p=document.createElement("div");p.className="panel author";p.innerHTML="<b>寫故事的人想說</b><div style='margin-top:10px'>我寫這篇，是因為有些人總忙著替別人留下回憶，忘了自己也值得被看見。那一張照片不需要證明永遠，只是有人真的看見了你。</div>";e.append(p);const t=document.createElement("textarea");t.className="entry";t.placeholder="最後想說什麼？";t.value=last;t.oninput=()=>last=t.value;e.append(t);button("讓 AI 聽聽我想說的話",async()=>{last=t.value;const r=$("reply");if(!last.trim()){r.textContent="先留一句話，好嗎？";return}const b=$("choices").firstChild;b.disabled=true;b.textContent="正在讀你的故事……";try{const res=await fetch("https://love-stories-reply-api.onrender.com/api/respond",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({story:"第八張照片",choices,expectation:words,words:last})});const d=await res.json();r.textContent=res.ok?d.reply:d.error||"稍後再試好嗎？"}catch{r.textContent="暫時無法連接回應服務。"}finally{b.disabled=false;b.textContent="再聽我說一次"}});const r=document.createElement("div");r.id="reply";r.className="panel reply";e.append(r);button("再玩一次",restart,true)}
}
function restart(){n=0;stage=0;choices=[];words="";last="";shown=false;show();move()}$("restart").onclick=restart;show();
</script></body></html>
